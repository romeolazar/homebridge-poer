<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <!-- Soft background glow & drop shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    
    <filter id="ring-glow-purple" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#8F48E8" flood-opacity="0.6"/>
    </filter>

    <filter id="ring-glow-teal" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#14B8A6" flood-opacity="0.6"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="hb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="60%" stop-color="#2E1065"/>
      <stop offset="100%" stop-color="#1E0A40"/>
    </linearGradient>

    <linearGradient id="hb-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#6B21A8"/>
    </linearGradient>

    <linearGradient id="poer-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2D3C"/>
      <stop offset="60%" stop-color="#081A24"/>
      <stop offset="100%" stop-color="#040E14"/>
    </linearGradient>

    <linearGradient id="poer-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="50%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#042F2E"/>
    </linearGradient>

    <linearGradient id="flame-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="60%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>

    <linearGradient id="overlap-blend" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333EA" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <g transform="translate(0, 0)">
    <!-- ==================== LEFT CIRCLE: HOMEBRIDGE ==================== -->
    <!-- Base Circle Drop Shadow & Fill -->
    <circle cx="230" cy="110" r="82" fill="url(#hb-bg)" filter="url(#shadow)"/>
    
    <!-- Subtle Inner Glow Ring -->
    <circle cx="230" cy="110" r="80" fill="none" stroke="url(#hb-ring)" stroke-width="4.5" filter="url(#ring-glow-purple)"/>
    <circle cx="230" cy="110" r="80" fill="none" stroke="url(#hb-ring)" stroke-width="4.5"/>
    <circle cx="230" cy="110" r="74" fill="none" stroke="#A855F7" stroke-width="1" stroke-dasharray="3 4" opacity="0.4"/>

    <!-- Homebridge Isometric Cube / House Symbol -->
    <g transform="translate(230, 108)">
      <!-- Roof Chimney Accent -->
      <path d="M14 -28 L22 -28 L22 -14 L14 -14 Z" fill="#D8B4FE" opacity="0.9"/>
      
      <!-- House / Cube Facets -->
      <!-- Top Roof Facet -->
      <polygon points="0,-36 34,-16 0,4 -34,-16" fill="#EDE9FE"/>
      <!-- Left Wall Facet -->
      <polygon points="-34,-16 0,4 0,38 -34,18" fill="#C4B5FD"/>
      <!-- Right Wall Facet -->
      <polygon points="0,4 34,-16 34,18 0,38" fill="#8B5CF6"/>
      
      <!-- Front Door / Gateway Silhouette -->
      <path d="M-8,14 L8,14 L8,38 L-8,38 Z" fill="#2E1065" opacity="0.85"/>
      <path d="M-5,17 Q0,12 5,17 L5,38 L-5,38 Z" fill="#4C1D95"/>
    </g>


    <!-- ==================== RIGHT CIRCLE: POER ==================== -->
    <!-- Base Circle Drop Shadow & Fill -->
    <circle cx="370" cy="110" r="82" fill="url(#poer-bg)" filter="url(#shadow)"/>
    
    <!-- Subtle Inner Glow Ring -->
    <circle cx="370" cy="110" r="80" fill="none" stroke="url(#poer-ring)" stroke-width="4.5" filter="url(#ring-glow-teal)"/>
    <circle cx="370" cy="110" r="80" fill="none" stroke="url(#poer-ring)" stroke-width="4.5"/>
    
    <!-- Thermostat Dial Tick Marks -->
    <g transform="translate(370, 110)">
      <!-- Circular Dial Marks -->
      <circle cx="0" cy="0" r="72" fill="none" stroke="#2DD4BF" stroke-width="1.5" stroke-dasharray="2 7" opacity="0.5"/>
      
      <!-- Temperature Heat Arc -->
      <path d="M -50,45 A 68 68 0 1 1 50,45" fill="none" stroke="url(#flame-grad)" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
      
      <!-- Thermostat Setpoint Indicator Dot -->
      <circle cx="48" cy="-28" r="4" fill="#FBBF24" filter="url(#shadow)"/>

      <!-- "POER" Wordmark -->
      <text x="0" y="-3" 
            font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
            font-size="28" 
            font-weight="900" 
            letter-spacing="3" 
            fill="#FFFFFF" 
            text-anchor="middle">
        POER
      </text>

      <!-- Smart Flame & Label -->
      <g transform="translate(0, 22)">
        <!-- Heating Flame Icon -->
        <path d="M0,8 C-4,8 -7,5 -7,1 C-7,-4 -2,-7 0,-12 C2,-7 7,-4 7,1 C7,5 4,8 0,8 Z" 
              fill="url(#flame-grad)"/>
        <!-- Inner Flame Glow -->
        <path d="M0,7 C-2,7 -3.5,5.5 -3.5,3 C-3.5,-0.5 -1,-2.5 0,-5 C1,-2.5 3.5,-0.5 3.5,3 C3.5,5.5 2,7 0,7 Z" 
              fill="#FEF08A"/>
        <!-- "SMART" Label -->
        <text x="14" y="5" 
              font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
              font-size="10" 
              font-weight="700" 
              letter-spacing="2" 
              fill="#2DD4BF" 
              text-anchor="start">
          SMART
        </text>
      </g>
    </g>


    <!-- ==================== AUDI-STYLE INTERLOCKING OVERLAP ==================== -->
    <!-- Clip path to give the Audi/Olympic interlaced ring weaving effect -->
    <!-- Circle 1 top weave passes over Circle 2 -->
    <g>
      <!-- Weave arc: Homebridge ring over Poer on top -->
      <path d="M 300,70 A 80 80 0 0 1 310,110" fill="none" stroke="url(#hb-ring)" stroke-width="4.5" stroke-linecap="round"/>
      <!-- Weave arc: Poer ring over Homebridge on bottom -->
      <path d="M 290,110 A 80 80 0 0 1 300,150" fill="none" stroke="url(#poer-ring)" stroke-width="4.5" stroke-linecap="round"/>
      <!-- Connection bridge pulse dot in center -->
      <circle cx="300" cy="110" r="3.5" fill="#E9D5FF" opacity="0.9"/>
    </g>
  </g>
</svg>
